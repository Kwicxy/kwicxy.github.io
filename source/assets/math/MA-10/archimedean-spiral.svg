<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">阿基米德螺线的一个完整转角</title>
  <desc id="desc">在以 r 和 theta 表示的极坐标系中，曲线 r 等于 theta 从零到二 pi 走过一周螺线弧。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#52616b"/></marker></defs>
  <rect width="640" height="360" fill="#fdfdfd"/>
  <g font-family="'STIX Two Text','STIXGeneral','Cambria Math','Noto Serif SC','Songti SC',serif" font-size="18" fill="#35424b">
    <circle cx="320" cy="182" r="75" fill="none" stroke="#d2dbe1" stroke-width="1.2" stroke-dasharray="5 5"/><circle cx="320" cy="182" r="151" fill="none" stroke="#d2dbe1" stroke-width="1.2" stroke-dasharray="5 5"/>
    <path d="M320 182 L496 182 M320 182 L320 39 M320 182 L144 182 M320 182 L320 325" fill="none" stroke="#98a7b3" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="490" y="226" font-size="16">θ = 0</text><text x="330" y="59" font-size="16">θ = π/2</text><text x="151" y="204" font-size="16">θ = π</text><text x="330" y="313" font-size="16">θ = 3π/2</text>
    <text x="326" y="105" font-size="16" fill="#65737d">r = π</text><text x="476" y="171" font-size="16" fill="#65737d">r = 2π</text>
    <path d="M320 182 L326 180 L331 176 L333 169 L333 160 L328 152 L320 144 L309 140 L295 138 L280 142 L266 151 L253 164 L245 182 L241 203 L244 226 L253 249 L270 269 L292 285 L320 295 L351 297 L383 291 L413 275 L440 251 L460 219 L471 182" fill="none" stroke="#2878a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="320" cy="182" r="4" fill="#d56a3a"/><circle cx="471" cy="182" r="5" fill="#d56a3a"/>
    <path d="M377 182 A58 58 0 0 0 363 141" fill="none" stroke="#d56a3a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="381" y="150" fill="#c25022">θ: 0 → 2π</text><text x="486" y="202" fill="#2878a8">r = θ</text>
    <text x="307" y="205" font-size="16">r = 0</text><text x="189" y="344" font-size="16" fill="#65737d">弧长微元：ds = √(r² + r′²) dθ</text>
  </g>
</svg>
