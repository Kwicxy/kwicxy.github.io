<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">例题曲边梯形与形心横坐标</title>
  <desc id="desc">曲线 y 等于 x 平方除以四减去二分之一 ln x，在一到 e 的区间内与坐标轴围成的区域。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#52616b"/></marker></defs>
  <rect width="640" height="360" fill="#fdfdfd"/>
  <g font-family="'STIX Two Text','STIXGeneral','Cambria Math','Noto Serif SC','Songti SC',serif" font-size="18" fill="#35424b">
    <line x1="61" y1="281" x2="592" y2="281" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="104" y1="319" x2="104" y2="46" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M191 281 L191 233 C261 211 333 183 463 106 L463 281Z" fill="#dcecf7"/>
    <line x1="61" y1="281" x2="592" y2="281" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M191 233 C261 211 333 183 463 106" fill="none" stroke="#2878a8" stroke-width="3.5"/>
    <line x1="191" y1="281" x2="191" y2="233" stroke="#52616b" stroke-width="1.5"/>
    <line x1="463" y1="281" x2="463" y2="106" stroke="#52616b" stroke-width="1.5"/>
    <circle cx="352" cy="215" r="6" fill="#d56a3a"/>
    <line x1="352" y1="215" x2="352" y2="281" stroke="#d56a3a" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="361" y="206" fill="#c25022">(x̄, ȳ)</text><text x="365" y="132" fill="#2878a8">y = x²/4 − (ln x)/2</text>
    <text x="183" y="306">1</text><text x="455" y="306">e</text><text x="600" y="288">x</text><text x="92" y="44">y</text>
    <text x="177" y="340" font-size="16" fill="#65737d">形心横坐标：x̄ = ∫xf(x)dx / ∫f(x)dx</text>
  </g>
</svg>
