<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">交换 x y 后的柱壳区域</title>
  <desc id="desc">曲线 x 等于 y 除以根号一减 y 平方、y 轴和两条水平线围成的区域，说明绕 x 轴使用水平柱壳。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#52616b"/></marker></defs>
  <rect width="640" height="360" fill="#fdfdfd"/>
  <g font-family="'STIX Two Text','STIXGeneral','Cambria Math','Noto Serif SC','Songti SC',serif" font-size="18" fill="#35424b">
    <line x1="76" y1="291" x2="587" y2="291" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="117" y1="322" x2="117" y2="44" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M117 224 L117 105 L365 105 C326 142 305 180 296 224Z" fill="#dcecf7"/>
    <path d="M296 224 C305 180 326 142 365 105" fill="none" stroke="#2878a8" stroke-width="3.5"/>
    <line x1="117" y1="224" x2="296" y2="224" stroke="#d56a3a" stroke-width="2"/>
    <line x1="117" y1="105" x2="365" y2="105" stroke="#d56a3a" stroke-width="2"/>
    <rect x="117" y="160" width="205" height="13" fill="#75b7d8" fill-opacity=".85" stroke="#2878a8"/>
    <line x1="117" y1="291" x2="117" y2="105" stroke="#52616b" stroke-width="2"/>
    <text x="370" y="92" fill="#2878a8">x = y/√(1−y²)</text>
    <text x="43" y="229">1/2</text><text x="42" y="111">√3/2</text>
    <text x="330" y="157" fill="#1e5d86">dy</text><text x="257" y="188" fill="#65737d">水平柱壳</text>
    <text x="595" y="298">x</text><text x="105" y="42">y</text><text x="105" y="309">O</text>
    <text x="152" y="338" font-size="16" fill="#65737d">绕 x 轴：半径为 y，高为 x(y)，厚度为 dy</text>
  </g>
</svg>
