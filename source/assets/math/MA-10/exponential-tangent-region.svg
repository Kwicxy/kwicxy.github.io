<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">指数曲线、原点切线与无界区域</title>
  <desc id="desc">y 等于 e 的 x 次方、其过原点的切线 y 等于 e x 和 x 轴围成向左无界的区域，标出旋转轴 x 等于一。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#52616b"/></marker></defs>
  <rect width="640" height="360" fill="#fdfdfd"/>
  <g font-family="'STIX Two Text','STIXGeneral','Cambria Math','Noto Serif SC','Songti SC',serif" font-size="18" fill="#35424b">
    <line x1="58" y1="282" x2="595" y2="282" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="190" y1="319" x2="190" y2="41" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M72 282 L416 282 C366 271 325 252 298 226 C260 189 252 146 281 119 C310 93 350 93 390 93 L416 282Z" fill="#dcecf7"/>
    <line x1="58" y1="282" x2="595" y2="282" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="190" y1="319" x2="190" y2="41" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M74 282 C159 281 210 277 240 264 C279 247 286 218 299 176 C313 129 348 91 419 72" fill="none" stroke="#2878a8" stroke-width="3.5"/>
    <line x1="190" y1="282" x2="419" y2="54" stroke="#d56a3a" stroke-width="3"/>
    <line x1="419" y1="282" x2="419" y2="54" stroke="#6d8798" stroke-width="1.8" stroke-dasharray="7 5"/>
    <circle cx="419" cy="54" r="5" fill="#d56a3a"/>
    <text x="427" y="66">(1, e)</text><text x="332" y="70" fill="#2878a8">y = eˣ</text><text x="350" y="177" fill="#c25022">y = ex</text>
    <text x="429" y="305" fill="#65737d">x = 1（旋转轴）</text>
    <text x="602" y="289">x</text><text x="177" y="38">y</text><text x="177" y="302">O</text>
    <text x="168" y="341" font-size="16" fill="#65737d">0 &lt; y &lt; e 时：左边界 ln y，右边界 y/e</text>
  </g>
</svg>
