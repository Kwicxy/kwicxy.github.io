<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">直角坐标下的曲边面积微元</title>
  <desc id="desc">两条曲线之间的阴影区域，以一条宽度为 dx 的竖直条带表示面积微元。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#52616b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfdfd"/>
  <g font-family="'STIX Two Text','STIXGeneral','Cambria Math','Noto Serif SC','Songti SC',serif" font-size="18" fill="#35424b">
    <line x1="68" y1="292" x2="594" y2="292" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="104" y1="320" x2="104" y2="46" stroke="#52616b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="602" y="299">x</text><text x="92" y="42">y</text><text x="88" y="311">O</text>
    <path d="M152 114 C238 86 316 123 397 103 C463 87 514 70 561 79 L561 220 C495 208 451 226 394 217 C304 203 226 228 152 220Z" fill="#dcecf7"/>
    <path d="M152 114 C238 86 316 123 397 103 C463 87 514 70 561 79" fill="none" stroke="#2878a8" stroke-width="3"/>
    <path d="M152 220 C226 228 304 203 394 217 C451 226 495 208 561 220" fill="none" stroke="#d56a3a" stroke-width="3"/>
    <line x1="152" y1="292" x2="152" y2="114" stroke="#98a7b3" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="561" y1="292" x2="561" y2="79" stroke="#98a7b3" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="403" y="100" width="18" height="116" fill="#75b7d8" fill-opacity=".78" stroke="#2878a8" stroke-width="1.5"/>
    <line x1="403" y1="249" x2="421" y2="249" stroke="#52616b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="392" y="274">dx</text>
    <text x="229" y="93" fill="#2878a8">y₁(x)</text>
    <text x="246" y="249" fill="#d56a3a">y₂(x)</text>
    <text x="143" y="316">a</text><text x="554" y="316">b</text>
    <text x="437" y="162" fill="#1e5d86">dS</text>
    <text x="205" y="337" font-size="16" fill="#65737d">竖直微元：dS = [y₁(x) − y₂(x)] dx</text>
  </g>
</svg>
