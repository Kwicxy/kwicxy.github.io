<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">伯努利双纽线的面积与对称性</title>
  <desc id="desc">在以 r 和 theta 表示的极坐标系中，伯努利双纽线的右上扇形被突出显示，说明其对称性。</desc>
  <rect width="640" height="360" fill="#fdfdfd"/>
  <g font-family="'STIX Two Text','STIXGeneral','Cambria Math','Noto Serif SC','Songti SC',serif" font-size="18" fill="#35424b">
    <circle cx="320" cy="180" r="70" fill="none" stroke="#d2dbe1" stroke-width="1.2" stroke-dasharray="5 5"/><circle cx="320" cy="180" r="140" fill="none" stroke="#d2dbe1" stroke-width="1.2" stroke-dasharray="5 5"/>
    <path d="M320 180 L586 180 M320 180 L320 37 M320 180 L54 180 M320 180 L320 323" fill="none" stroke="#98a7b3" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="548" y="202" font-size="16">θ = 0</text><text x="330" y="59" font-size="16">θ = π/2</text><text x="66" y="202" font-size="16">θ = π</text><text x="330" y="313" font-size="16">θ = 3π/2</text><text x="330" y="171" font-size="16">r = 0</text>
    <path d="M320 180 C365 119 499 106 548 180 C499 254 365 241 320 180Z" fill="#dcecf7" stroke="#2878a8" stroke-width="3"/>
    <path d="M320 180 C275 119 141 106 92 180 C141 254 275 241 320 180Z" fill="#dcecf7" stroke="#2878a8" stroke-width="3"/>
    <path d="M320 180 C357 133 441 127 487 155 C437 139 376 148 320 180Z" fill="#75b7d8" fill-opacity=".9" stroke="#2878a8" stroke-width="1.2"/>
    <line x1="320" y1="180" x2="487" y2="155" stroke="#52616b" stroke-width="1.5"/><line x1="320" y1="180" x2="440" y2="60" stroke="#52616b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="M381 171 A62 62 0 0 0 364 136" fill="none" stroke="#d56a3a" stroke-width="2"/>
    <text x="385" y="158" fill="#c25022">0 ≤ θ ≤ π/4</text><text x="432" y="114" fill="#2878a8">r² = a² cos 2θ</text>
    <text x="140" y="343" font-size="16" fill="#65737d">关于极径 θ = 0 与 θ = π/2 对称：总面积 = 4 × (0 ≤ θ ≤ π/4) 的面积</text>
  </g>
</svg>
